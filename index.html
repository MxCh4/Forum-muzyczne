<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum o muzyce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Forum muzyczne</div>
    <button class="hamburger" id="hamburger-btn">☰</button>
    <nav id="nav-menu">
      <ul>
        <li><a href="#about">O stronie</a></li>
        <li><a href="#projects">Wykonawcy</a></li>
        <li><a href="#contact">Kontakt</a></li>
      </ul>
    </nav>
    <button id="theme-toggle">Zmien motyw 🌙</button>
  </header>

  <main>
    <section id="about">
      <h1>Forum dla fanów dobrej polskiej muzyki</h1>
      <p>Jesteś fanem polskiej muzyki z lat 80-90? Z pewnością ta strona jest dopasowana pod ciebie.</p>
    </section>

    <section id="artists">
      <h2>Wykonawcy</h2>
      <div class="project-grid">
        <article class="project-card">
          <h3>Artysta 1</h3>
          <p>Opis 1 wykonawcy.</p>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>Kontakt</h2>
      <form id="contact-form">
        <div class="form-field">
          <label for="name">Imię:</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email:</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-field">
          <label for="pytanie">Treść pytania:</label>
          <textarea id="pytanie"></textarea>
        </div>
        <button type="submit">Wyślij</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Moja Strona. Wszelkie prawa zastrzeżone.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
